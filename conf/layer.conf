# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "partup"
BBFILE_PATTERN_partup = "^${LAYERDIR}/"
BBFILE_PRIORITY_partup = "20"
LAYERVERSION_partup = "1"
LAYERDEPENDS_partup = "core"
LAYERSERIES_COMPAT_partup = "scarthgap"
