# Example partup layout. Set PARTUP_LAYOUT_CONFIG = "layout-example.yaml" and
# PARTUP_PACKAGE_FILES = "<bootloader> ${IMAGE_LINK_NAME}.ext4" in your config.
api-version: 1
disklabel: msdos

partitions:
  - label: root
    type: primary
    filesystem: null
    expand: true
    block-size: 4kiB
    input:
      - filename: ${IMAGE_LINK_NAME}.ext4
